# Based on https://github.com/r-lib/actions/blob/v2/examples/check-standard.yaml
name: R-CMD-check

on:
  push:
    branches: [main, master, 'feature/**', 'performance/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release', incoming: true}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # V8 is only for R CMD check's HTML math validation.
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.incoming && 'any::V8' || '' }}
          needs: check
      - uses: r-lib/actions/setup-pandoc@v2
        if: ${{ matrix.config.incoming }}
      - name: Install HTML validation tools
        if: ${{ matrix.config.incoming }}
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy
      - uses: r-lib/actions/setup-tinytex@v2
        if: ${{ matrix.config.incoming }}
      - name: Install reference-manual fonts
        if: ${{ matrix.config.incoming }}
        run: |
          tlmgr update --self
          tlmgr install inconsolata helvetic times courier ec
      - name: Check package
        if: ${{ !matrix.config.incoming }}
        uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual")'
          upload-results: 'true'
      - name: Full CRAN check including incoming
        if: ${{ matrix.config.incoming }}
        env:
          _R_CHECK_CRAN_INCOMING_: 'true'
          _R_CHECK_CRAN_INCOMING_REMOTE_: 'true'
          _R_CHECK_FORCE_SUGGESTS_: 'true'
          _R_CHECK_SYSTEM_CLOCK_: 'true'
        run: make check
      - name: Enforce warning-free full check
        if: ${{ matrix.config.incoming }}
        shell: Rscript {0}
        run: |
          pkg <- read.dcf("DESCRIPTION")[1, "Package"]
          status <- grep("^Status:", readLines(file.path(paste0(pkg, ".Rcheck"), "00check.log")), value = TRUE)
          if (length(status) != 1L || grepl("ERROR|WARNING", status)) {
            stop("Full R CMD check did not finish without errors and warnings.")
          }
          cat(status, "\n")
      - name: Upload full CRAN check and tarball
        if: ${{ always() && matrix.config.incoming }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: CRAN-incoming-linux-release
          path: |
            fgof.Rcheck/
            fgof_*.tar.gz
